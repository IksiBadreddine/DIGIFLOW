# docker-compose.yml

version: "3.9"

services:

  # ============================================================
  # POSTGRESQL - Base de données des métadonnées
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: presalesai_postgres
    environment:
      POSTGRES_DB: digiflow
      POSTGRES_USER: digiflow
      POSTGRES_PASSWORD: digiflow123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - presalesai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiflow -d digiflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # MINIO - Stockage des fichiers (S3 compatible)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: presalesai_minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - presalesai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
    name: presalesai_postgres_data
  minio_data:
    name: presalesai_minio_data

# ============================================================
# NETWORKS
# ============================================================
networks:
  presalesai_network:
    name: presalesai_network
    driver: bridge